name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # devbox.lock in the key: the go-build cache holds artifacts
          # linked against nix store paths — a toolchain bump with a stale
          # restored cache yields "fork/exec ...: no such file" in go test.
          key: go-${{ runner.os }}-${{ hashFiles('devbox.lock') }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('devbox.lock') }}-

      - name: Install devbox
        run: curl -fsSL https://get.jetify.com/devbox | bash -s -- -f

      - run: devbox run -- just check

  # Integration tests run against a REAL throwaway GitHub org plus localstack
  # (SSM/S3). Public CI has no AWS reach by design, hence localstack; the
  # GitHub side is genuinely real, because a mock cannot reproduce GitHub's
  # invitation lifecycle — the exact semantics this service depends on.
  #
  # Fork pull requests get no secrets (that is what makes a public repo safe),
  # so this job skips itself there and `check` remains the gate they must pass.
  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('devbox.lock') }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('devbox.lock') }}-

      - name: Install devbox
        run: curl -fsSL https://get.jetify.com/devbox | bash -s -- -f

      - name: Start localstack (SSM + S3)
        run: |
          docker run -d --name localstack -p 4566:4566 \
            -e SERVICES=ssm,s3 \
            localstack/localstack:4
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:4566/_localstack/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "localstack did not become healthy" >&2
          docker logs localstack >&2
          exit 1

      - run: devbox run -- just integration
        env:
          # Namespaces every mutation this run makes in the sandbox org, so
          # concurrent CI runs cannot collide and leftovers are attributable.
          ROSTER_TEST_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
          ROSTER_TEST_ORG: ${{ secrets.SANDBOX_ORG }}
          ROSTER_TEST_CONSOLE_APP_ID: ${{ secrets.SANDBOX_CONSOLE_APP_ID }}
          ROSTER_TEST_CONSOLE_INSTALLATION_ID: ${{ secrets.SANDBOX_CONSOLE_INSTALLATION_ID }}
          ROSTER_TEST_CONSOLE_PRIVATE_KEY: ${{ secrets.SANDBOX_CONSOLE_PRIVATE_KEY }}
          ROSTER_TEST_APPLIER_APP_ID: ${{ secrets.SANDBOX_APPLIER_APP_ID }}
          ROSTER_TEST_APPLIER_INSTALLATION_ID: ${{ secrets.SANDBOX_APPLIER_INSTALLATION_ID }}
          ROSTER_TEST_APPLIER_PRIVATE_KEY: ${{ secrets.SANDBOX_APPLIER_PRIVATE_KEY }}
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_REGION: eu-west-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - unconvert
    - unparam
    - nolintlint
    - gosec
    - gocyclo

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # Identity and the page view models are passed by value on purpose.
        # In authorization code, value semantics are a safety property: an
        # Identity nobody holds a pointer to cannot be mutated behind a
        # handler's back. Copying ~100 bytes once per request is not this
        # service's bottleneck.
        - hugeParam
    misspell:
      locale: US
    gocyclo:
      # Same bar as the sibling services: Go Report Card uses 15, we allow 25
      # for wiring/setup functions. Anything above 25 should be refactored.
      min-complexity: 25

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
          - gocyclo
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/truvity/github-roster

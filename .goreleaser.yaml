project_name: github-roster

version: 2

builds:
  - id: github-roster
    main: ./cmd/server
    binary: github-roster
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.FullCommit}}

  - id: roster-acceptance
    main: ./cmd/acceptance
    binary: roster-acceptance
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.Version={{.Version}} -X main.Commit={{.FullCommit}}

archives:
  - id: binary
    ids:
      - github-roster
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

kos:
  - id: github-roster
    build: github-roster
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    bare: true
    preserve_import_paths: false
    base_import_paths: true
    base_image: gcr.io/distroless/static:nonroot
    sbom: none
    labels:
      org.opencontainers.image.title: github-roster
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/github-roster

  # The test image: same release, same tag, different artifact — so the
  # chart's hooks always run the tests that match the deployed version,
  # while the service image carries no test code at all.
  - id: roster-acceptance
    build: roster-acceptance
    # base_import_paths appends basename(cmd dir): with the caller's
    # ko-docker-repo ghcr.io/truvity/github-roster the published slugs
    # nest as github-roster/{server,acceptance} (INF-575 / INF-584 N1).
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    bare: true
    preserve_import_paths: false
    base_import_paths: true
    base_image: gcr.io/distroless/static:nonroot
    sbom: none
    labels:
      org.opencontainers.image.title: roster-acceptance
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: https://github.com/truvity/github-roster

release:
  github:
    owner: truvity
    name: github-roster
  header: |
    ## github-roster {{ .Tag }}

    Docker image: `ghcr.io/truvity/github-roster/server:{{ .Version }}`
    Helm chart: `oci://ghcr.io/truvity/charts/github-roster:{{ .Version }}`

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

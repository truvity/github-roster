{{- if .Values.applierSecrets.create }}
{{- range .Values.config.companies }}
{{- with .github }}
# The applier App's private key, materialized from the parameter store into
# the Secret the reconciler Job mounts.
#
# This is the one place the write credential touches Kubernetes, and it
# goes straight from the store into a Secret the WEB TIER never reads —
# the service is given only this Secret's NAME. External Secrets is used
# rather than the service copying it precisely so that no process of ours
# ever holds both the read and the write credential at once.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .applierSecret | default (printf "roster-applier-%s" .org) }}
  labels:
    {{- include "github-roster.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.applierSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "applierSecrets.secretStoreRef.name is required when applierSecrets.create" $.Values.applierSecrets.secretStoreRef.name }}
    kind: {{ $.Values.applierSecrets.secretStoreRef.kind }}
  target:
    name: {{ .applierSecret | default (printf "roster-applier-%s" .org) }}
    creationPolicy: Owner
  data:
    - secretKey: github-private-key
      remoteRef:
        key: {{ .applierAppSSM }}/github-private-key
---
{{- end }}
{{- end }}
{{- end }}

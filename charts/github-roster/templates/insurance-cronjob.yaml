{{- if and .Values.insuranceCronJob.enabled .Values.broker.enabled }}
# The insurance CronJob: revocation must survive a wedged ticker.
#
# The scheduled removals run inside the broker process. If that goroutine
# wedges while the HTTP listener stays healthy, nothing restarts the pod —
# and the leaver SLA quietly stops being met. This CronJob is the
# independent heartbeat: it POSTs the broker's /internal/sweep, which
# triggers the same removals-only sweep through a different entry path.
#
# Safe to fire at any time: the sweep is removals-only by construction,
# serialized (a concurrent run answers 409, which curl -f treats as
# failure — visible, and harmless), and a no-op when nobody is gone.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "github-roster.fullname" . }}-insurance
  labels:
    {{- include "github-roster.labels" . | nindent 4 }}
  annotations:
    # A failed SWEEP is an alerting matter, not a deploy gate: with the
    # default health check, one failed insurance run marks the whole
    # application Degraded and BLOCKS ArgoCD sync waves — which held
    # back an unrelated fix for hours on 2026-07-31.
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  schedule: {{ .Values.insuranceCronJob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            {{- include "github-roster.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: insurance
        spec:
          restartPolicy: Never
          containers:
            - name: sync
              image: {{ .Values.insuranceCronJob.image | quote }}
              # 409 is the serialized-run answer ("a sweep is already
              # running") — the insurance goal is met, not missed.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST --max-time 240                     http://{{ include "github-roster.fullname" . }}-broker:8080/internal/sweep)
                  case "$code" in
                    2*|409) echo "sync answered $code"; exit 0 ;;
                    *) echo "sync answered $code"; exit 1 ;;
                  esac
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop: [ALL]
{{- end }}

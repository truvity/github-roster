{{- if .Values.networkPolicy.enabled }}
# The console is reachable only through the gateway.
#
# This is defense in depth, not the authorization itself: the service
# verifies the forwarded token on every request, precisely so that its access
# control does not rest on a policy file being correct. Both should hold.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "github-roster.fullname" . }}-ingress
  labels:
    {{- include "github-roster.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "github-roster.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.exposure.gateway.namespace }}
      ports:
        - port: http
          protocol: TCP
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

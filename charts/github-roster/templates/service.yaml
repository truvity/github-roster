apiVersion: v1
kind: Service
metadata:
  name: {{ include "github-roster.fullname" . }}
  labels:
    {{- include "github-roster.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    # The internal listener: /healthz for probes, POST /sync for the
    # insurance CronJob. Cluster-internal only — the HTTPRoute never
    # references it, so the gateway cannot route to it.
    - name: health
      port: {{ .Values.healthPort }}
      targetPort: health
      protocol: TCP
  selector:
    {{- include "github-roster.selectorLabels" . | nindent 4 }}

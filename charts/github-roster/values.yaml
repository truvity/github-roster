replicaCount: 1

image:
  repository: ghcr.io/truvity/github-roster
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  # Pod identity / IRSA annotations go here — the service reads the mapping
  # from SSM and writes audit records to S3 with the pod's own identity.
  annotations: {}

service:
  type: ClusterIP
  port: 8080

healthPort: 7070

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Instance-level settings only. Everything about *which* organizations,
# directories and teams this instance manages lives in `config` below.
env:
  CONFIG_FILE: "/etc/github-roster/config.yaml"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

# Secret environment variables (e.g. the OIDC client secret and the session
# key, from an ESO-managed Secret).
envFrom: []
# - secretRef:
#     name: github-roster-secrets

# The service configuration document, rendered verbatim into a ConfigMap.
# See docs/reference/configuration.md for the full schema.
#
# The oidc block is read twice: the service uses it to map claims to roles,
# and the exposure templates below use it to build the gateway's
# authorization rule — so the edge and the app cannot disagree about which
# groups matter.
config:
  oidc:
    rolesClaim: groups
    roles:
      viewer: ""
      operator: ""

# Browser exposure. The gateway runs the login and the session; this service
# holds no client secret and mints no sessions of its own.
exposure:
  enabled: false
  hostname: ""
  # The identity provider, and where its keys live. The service discovers
  # the JWKS itself from `config.oidc.issuer`; the gateway needs it spelled
  # out because Envoy does not do discovery.
  issuer: ""
  jwksURI: ""
  gateway:
    name: tenants
    namespace: envoy-gateway-system
    sectionName: tenants
  oidcApp:
    # The Zitadel operator mints the client and writes the Secret Envoy
    # reads. Turn this off to point at a client registered by hand.
    create: true
    name: ""
    projectRef: ""

networkPolicy:
  enabled: false
  extraIngress: []

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

replicaCount: 1

image:
  repository: ghcr.io/truvity/github-roster
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

# The test image: built by the same release as the service image, so the
# default tag — the chart's appVersion — always runs the tests matching the
# deployed version. A drifting tag here would quietly test the wrong thing.
testImage:
  repository: ghcr.io/truvity/github-roster-acceptance
  tag: ""  # defaults to appVersion

# helm test behavior. `selftest` always renders (read-only, safe on prod);
# the mutating acceptance suite exists only when these values say so, which
# production values never do.
test:
  mutating: false
  executionID: ""

serviceAccount:
  create: true
  name: ""
  # Pod identity / IRSA annotations go here — the service reads the mapping
  # from SSM and writes audit records to S3 with the pod's own identity.
  annotations: {}

service:
  type: ClusterIP
  port: 8080

healthPort: 7070

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Instance-level settings only. Everything about *which* organizations,
# directories and teams this instance manages lives in `config` below.
env:
  CONFIG_FILE: "/etc/github-roster/config.yaml"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

# Secret environment variables (e.g. the OIDC client secret and the session
# key, from an ESO-managed Secret).
envFrom: []
# - secretRef:
#     name: github-roster-secrets

# The service configuration document, rendered verbatim into a ConfigMap.
# See docs/reference/configuration.md for the full schema.
#
# The oidc block is read twice: the service uses it to map claims to roles,
# and the exposure templates below use it to build the gateway's
# authorization rule — so the edge and the app cannot disagree about which
# groups matter.
config:
  oidc:
    rolesClaim: groups
    roles:
      viewer: ""
      operator: ""

# Browser exposure. The gateway runs the login and the session; this service
# holds no client secret and mints no sessions of its own.
exposure:
  enabled: false
  hostname: ""
  # The identity provider, and where its keys live. The service discovers
  # the JWKS itself from `config.oidc.issuer`; the gateway needs it spelled
  # out because Envoy does not do discovery.
  issuer: ""
  jwksURI: ""
  gateway:
    name: tenants
    namespace: envoy-gateway-system
    sectionName: tenants
  oidcApp:
    # The Zitadel operator mints the client and writes the Secret Envoy
    # reads. Turn this off to point at a client registered by hand.
    create: true
    name: ""
    projectRef: ""

networkPolicy:
  enabled: false
  extraIngress: []

# The Role letting the service create reconciler Jobs in its own namespace.
rbac:
  create: true

# The insurance CronJob: POSTs /sync on the internal listener so leaver
# revocation survives a wedged in-process ticker. Offset from the hour so
# it does not race the service's own schedule.
insuranceCronJob:
  enabled: true
  schedule: "37 * * * *"
  image: curlimages/curl:8.10.1

# The audit trail. Records go here rather than to the pod's logs, so they
# outlive the container that wrote them.
audit:
  bucket: ""
  # Declare the bucket through ACK as part of this chart. Turn off where
  # the bucket is provisioned elsewhere.
  createBucket: false
  encryption:
    algorithm: AES256
    kmsKeyID: ""
  # How long records are kept, in days. Empty means keep them for ever —
  # deliberately the default, because silently ageing out an audit trail is
  # worse than storing a few megabytes too long.
  retentionDays: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

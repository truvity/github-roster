{{define "content"}}
<h1>Applying to {{.Data.Org}}</h1>
<p class="lede">
  Plan <code>{{.Data.Hash}}</code> · run <code>{{.Data.ID}}</code> —
  the broker narrates below as it executes. Leaving this page does not
  stop the run; the audit record is the durable account.
</p>

<section class="card">
<pre id="transcript" data-org="{{.Data.Org}}" data-run="{{.Data.ID}}" style="overflow-x:auto;font-size:12px;min-height:120px;margin:0"></pre>
<p id="verdict" class="lede" style="margin:12px 0 0" hidden></p>
</section>

<p style="margin-top:16px"><a href="/sync">Back to Sync</a> · <a href="/audit?org={{.Data.Org}}">Audit</a></p>

<script src="/static/run.js" defer></script>
{{end}}

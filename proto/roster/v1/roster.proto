syntax = "proto3";

// Package roster.v1 is the console's typed API, served over ConnectRPC beside
// the existing huma JSON endpoints. The SPA (Connect-Web) and any Go client
// share this one contract, so a drifted field is a compile error rather than a
// runtime surprise. Endpoints are migrated off /api/* incrementally; GetVersion
// is the first, proving the toolchain and the server wiring end to end.
package roster.v1;

option go_package = "github.com/truvity/github-roster/gen/roster/v1;rosterv1";

// RosterService is the read/console surface. Methods are added as the SPA
// views move over from the huma JSON API.
service RosterService {
  // GetVersion returns the running build's identity — the same information the
  // SPA header shows, previously fetched from GET /api/version.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);

  // GetSettings returns the directories, organizations and teams the Settings
  // view shows (git-declared sources plus operator-added store directories),
  // previously fetched from GET /api/settings.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);

  // GetRoster returns the joined roster the People view shows. NOTE: the JSON
  // GET /api/roster stays — it is a cross-repo contract (the gitops puller
  // commits it); this is the SPA's typed view of the same data.
  rpc GetRoster(GetRosterRequest) returns (GetRosterResponse);

  // GetStatus returns per-organization reconcile status (Status view). The
  // caller's bearer token is forwarded to the broker, which authorizes.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // GetAudit returns audit records, newest first (History view).
  rpc GetAudit(GetAuditRequest) returns (GetAuditResponse);

  // GetMe returns the signed-in caller (name, email, role) as the gateway
  // forwards it, so the SPA header can show who is logged in and whether they
  // may operate or only view.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);

  // StageOrg stages an operator-added organization in the config store (name,
  // one seed team, optional minimum-owners), born reconcile-disabled and
  // credential-less. Operator-only. It then shows a "Create GitHub App" link
  // that starts the manifest flow. Replaces the retired SSR form.
  rpc StageOrg(StageOrgRequest) returns (StageOrgResponse);

  // AddDirectory stores an operator-added resolver-backed directory; the
  // reconcile loop uses it on its next pass. Operator-only.
  rpc AddDirectory(AddDirectoryRequest) returns (AddDirectoryResponse);

  // DeleteDirectory removes an operator-added directory. Operator-only.
  rpc DeleteDirectory(DeleteDirectoryRequest) returns (DeleteDirectoryResponse);

  // SetPaused pauses or resumes the reconcile loop for one organization
  // (forwarded to the broker, which holds the control flag). Operator-only.
  rpc SetPaused(SetPausedRequest) returns (SetPausedResponse);

  // RunReconcile triggers an immediate reconcile pass on the broker instead of
  // waiting for the next tick. Operator-only.
  rpc RunReconcile(RunReconcileRequest) returns (RunReconcileResponse);

  // SetReconcileEnabled turns an organization's reconcile loop on or off — the
  // operator's UI override of the config day-0 default. Operator-only.
  rpc SetReconcileEnabled(SetReconcileEnabledRequest) returns (SetReconcileEnabledResponse);

  // PutPerson creates or updates a roster mapping entry — the Approve/Add
  // (NEW), Adopt (UNKNOWN) and Edit actions. Operator-only. Creating (or
  // first-blessing) an entry stamps approvedBy/approvedAt; edits preserve them.
  rpc PutPerson(PutPersonRequest) returns (PutPersonResponse);

  // DeletePerson removes a mapping entry (the operator "Remove"). Operator-only.
  rpc DeletePerson(DeletePersonRequest) returns (DeletePersonResponse);

  // GetPerson returns one raw mapping entry (name, github, k8s, class, emails,
  // pinned) so the operator's Edit form can prefill every field — the joined
  // Person the roster shows omits emails/pinned. Operator-only.
  rpc GetPerson(GetPersonRequest) returns (GetPersonResponse);
}

message GetPersonRequest {
  string name = 1;
}

message GetPersonResponse {
  string name = 1;
  string github = 2;
  repeated string emails = 3;
  string k8s = 4;
  string class = 5;
  repeated string pinned = 6;
  // Provenance stamped when the entry was first blessed (empty if never).
  string approved_by = 7;
  string approved_at = 8;
}

message PutPersonRequest {
  string name = 1;
  string github = 2;
  repeated string emails = 3;
  string k8s = 4;
  string class = 5;
  repeated string pinned = 6;
}

message PutPersonResponse {}

message DeletePersonRequest {
  string name = 1;
}

message DeletePersonResponse {}

message AddDirectoryRequest {
  string name = 1;
  repeated string domains = 2;
  string endpoint = 3;
  string probe_group = 4;
}

message AddDirectoryResponse {}

message DeleteDirectoryRequest {
  string name = 1;
}

message DeleteDirectoryResponse {}

message SetPausedRequest {
  string org = 1;
  bool paused = 2;
}

message SetPausedResponse {}

message SetReconcileEnabledRequest {
  string org = 1;
  bool enabled = 2;
}

message SetReconcileEnabledResponse {}

message RunReconcileRequest {}

message RunReconcileResponse {}

message StageOrgRequest {
  string name = 1;
  int32 min_admins = 2;
  string team = 3;
  repeated string groups = 4;
  repeated string members = 5;
}

message StageOrgResponse {}

message GetMeRequest {}

message GetMeResponse {
  // Display name, email address, and role ("operator" | "viewer" | "").
  string name = 1;
  string email = 2;
  string role = 3;
}

message GetVersionRequest {}

message GetVersionResponse {
  // Semantic (or pseudo) version of the running build.
  string version = 1;
  // Source revision the build was cut from (empty for an untagged dev build).
  string commit = 2;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  // Git-declared directory sources.
  repeated DirectorySource sources = 1;
  // Operator-added directories from the config store (editable in Settings).
  repeated DirectorySource store_sources = 2;
  // Git-declared organizations and their teams.
  repeated Org orgs = 3;
  // Operator-added organizations staged in the config store (display only;
  // born disabled, not yet reconciled).
  repeated Org store_orgs = 4;
}

message DirectorySource {
  string name = 1;
  // The old flat fields: `repeated string domains = 2` and
  // `string probe_group = 4` became per-domain DomainInfo entries.
  reserved 2, 4;
  // Set when the source reads through a DirectoryService (google-group-sync).
  string endpoint = 3;
  // Domains this source serves, each with its own probe and sync switch.
  repeated DomainInfo domains = 5;
}

// DomainInfo is one email domain of a directory: its own health canary and
// its own sync switch (a non-synced domain is shown, never granted from).
message DomainInfo {
  string domain = 1;
  string probe_group = 2;
  bool sync = 3;
}

message Org {
  string name = 1;
  string company = 2;
  int32 min_admins = 3;
  bool reconcile_enabled = 4;
  repeated Team teams = 5;
  // How the org's App came to be: "manual" (adopted) or "roster" (created via
  // the manifest flow); empty for git-declared orgs.
  string provenance = 6;
}

message Team {
  string name = 1;
  repeated string groups = 2;
  repeated string members = 3;
  bool pinned = 4;
}

message GetRosterRequest {}

message GetRosterResponse {
  repeated Person people = 1;
  // Candidates are the awaiting-approval worklist: people the join detected but
  // nobody has approved — NEW (live in a mapped group, no entry) and UNKNOWN
  // (a GitHub member matching no entry).
  repeated Candidate candidates = 2;
}

// Candidate is an awaiting-approval row. For NEW the name is known and a
// GitHub login must be supplied; for UNKNOWN the login is known and a name
// must be supplied. Approving one is a PutPerson.
message Candidate {
  // Kind is "new" (unmapped live person) or "unknown" (unmapped GitHub member).
  string kind = 1;
  // Name is set for NEW (the directory display name); empty for UNKNOWN.
  string name = 2;
  // Github is set for UNKNOWN (the member login); empty for NEW.
  string github = 3;
  // Org is set for UNKNOWN (the organization the member was found in).
  string org = 4;
  string detail = 5;
  // The IdP identity behind a NEW candidate — how the join found them:
  // primary email, the directories that know them, and the per-source
  // address + liveness. Empty for UNKNOWN (GitHub is the only source).
  string email = 6;
  repeated string sources = 7;
  map<string, DirectoryIdentity> directories = 8;
}

message Person {
  string name = 1;
  string github = 2;
  string class = 3;
  bool live = 4;
  string state = 5;
  map<string, Membership> orgs = 6;
  // Primary display email — the address from the first directory that knew
  // them. The join never keys on it; display only.
  string email = 7;
  // Sources names the directories that currently know this person.
  repeated string sources = 8;
  // ExpectedSources names the directories that SHOULD know them (derived from
  // their email domains). A source in expected but not in sources is a person
  // who has gone missing from a directory that ought to hold them.
  repeated string expected_sources = 9;
  // NoTeam is true when no group, member list, or pin resolves this person to
  // any team in any org — mapped but inert (nothing will ever be granted).
  bool no_team = 10;
  // Directories is the per-source identity trace: which directory knows them,
  // under which email, and whether that account is live there. Keyed by source
  // name. The IdP(s) → mapping → org(s) trail starts here.
  map<string, DirectoryIdentity> directories = 11;
}

// DirectoryIdentity is how one directory knows a person.
message DirectoryIdentity {
  string email = 1;
  bool live = 2;
}

message Membership {
  bool member = 1;
  bool invitation_pending = 2;
  string role = 3;
  // State is the per-org reconcile lifecycle: synced/pending/invited/leaving.
  string state = 4;
  // Live is this person's liveness FOR THIS ORG (home-company rule).
  bool live = 5;
  // Teams they currently belong to; DesiredTeams is what config says they
  // should. The difference is exactly what a sync would change — it explains
  // a "pending" state.
  repeated string teams = 6;
  repeated string desired_teams = 7;
}

message GetStatusRequest {}

message GetStatusResponse {
  repeated ReconcileStatus statuses = 1;
}

message ReconcileStatus {
  string org = 1;
  bool enabled = 2;
  bool paused = 3;
  string at = 4; // RFC 3339
  int32 actions = 5;
  bool applied = 6;
  bool held = 7;
  string reason = 8;
  string error = 9;
  // Breakdown of `actions` by kind, so the operator sees what would change.
  int32 adds = 10;
  int32 removes = 11;
  int32 role_changes = 12;
  int32 team_changes = 13;
  // Details is the per-action list behind the counts, so the operator can
  // expand "+2 invite" and see exactly who and which team.
  repeated ReconcileChange details = 14;
}

// ReconcileChange is one concrete action the plan would take, surfaced so the
// Status view can explain a count rather than only tally it.
message ReconcileChange {
  // Verb is the action: "invite", "invite-admin", "remove", "cancel-invite",
  // "role", "team-add", "team-remove".
  string verb = 1;
  // Login is the GitHub login the action targets.
  string login = 2;
  // Team is set for team-add/team-remove.
  string team = 3;
}

message GetAuditRequest {
  string org = 1; // optional filter
  int32 limit = 2; // 0 → server default
}

message GetAuditResponse {
  repeated AuditRecord records = 1;
}

message AuditRecord {
  string at = 1; // RFC 3339
  string org = 2;
  string kind = 3;
  bool confirmed = 4;
  string actor = 5;
  string actor_email = 6;
  repeated string adding = 7;
  repeated string removing = 8;
  repeated AuditChange changes = 9;
  string error = 10;
}

message AuditChange {
  string verb = 1;
  string subject = 2;
  string team = 3;
  string detail = 4;
}
